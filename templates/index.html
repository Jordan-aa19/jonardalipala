
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student API Interface</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            max-width: 750px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #183153;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        button {
            background: #087cff;
            color: white;
            padding: 10px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }

        button:hover {
            background: #0056b3;
        }

        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin: 5px;
        }

        .result {
            margin-top: 15px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background: #fafafa;
        }

        .student {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        h2 {
            color: #183153;
        }
    </style>
</head>

<body>

    <h1>Student API Interface</h1>

    <!-- STUDENT INFORMATION -->
    <div class="card">

        <h2>Student Information</h2>

        <button onclick="loadStudent()">
            Load Student Information
        </button>

        <div id="result" class="result"></div>

    </div>


    <!-- GREETING API -->
    <div class="card">

        <h2>Greeting API</h2>

        <input
            type="text"
            id="nameInput"
            placeholder="Enter your first name"
        >

        <button onclick="sayHello()">
            Say Hello
        </button>

        <p id="greeting"></p>

    </div>


    <!-- CUSTOM SCHOOL API -->
    <div class="card">

        <h2>Custom School API</h2>

        <button onclick="loadSchool()">
            Load School Information
        </button>

        <div id="schoolResult" class="result"></div>

    </div>


    <!-- DATABASE STUDENTS -->
    <div class="card">

        <h2>Students from Database</h2>

        <button onclick="loadStudents()">
            Load Students
        </button>

        <div id="studentList" class="result"></div>

    </div>


    <!-- SEARCH BY SECTION -->
    <div class="card">

        <h2>Search Students by Section</h2>

        <input
            type="text"
            id="sectionInput"
            placeholder="Enter section (A, B, C)"
        >

        <button onclick="searchSection()">
            Search Students
        </button>

        <div id="sectionResult" class="result"></div>

    </div>


    <script>

        // STUDENT INFORMATION
        function loadStudent() {

            fetch('/student')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Student API error');
                }
                return response.json();
            })
            .then(data => {

                document.getElementById('result').innerHTML =
                    '<p><b>Student ID:</b> ' + data.student_id + '</p>' +
                    '<p><b>Name:</b> ' + data.name + '</p>' +
                    '<p><b>Program:</b> ' + data.program + '</p>' +
                    '<p><b>Year:</b> ' + data.year + '</p>' +
                    '<p><b>Section:</b> ' + data.section + '</p>';

            })
            .catch(error => {
                document.getElementById('result').innerText =
                    'Unable to retrieve data.';
            });

        }


        // GREETING API
        function sayHello() {

            const name =
                document.getElementById('nameInput').value;

            fetch('/hello?name=' + encodeURIComponent(name))
            .then(response => response.json())
            .then(data => {

                document.getElementById('greeting').innerText =
                    data.message;

            })
            .catch(error => {

                document.getElementById('greeting').innerText =
                    'Unable to retrieve greeting.';

            });

        }


        // CUSTOM SCHOOL API
        function loadSchool() {

            fetch('/school')
            .then(response => {
                if (!response.ok) {
                    throw new Error('School API error');
                }
                return response.json();
            })
            .then(data => {

                document.getElementById('schoolResult').innerHTML =
                    '<p><b>School:</b> ' + data.school_name + '</p>' +
                    '<p><b>Location:</b> ' + data.location + '</p>' +
                    '<p><b>Program:</b> ' + data.program + '</p>' +
                    '<p><b>Department:</b> ' + data.department + '</p>';

            })
            .catch(error => {

                document.getElementById('schoolResult').innerText =
                    'Unable to retrieve school information.';

            });

        }


        // LOAD ALL STUDENTS FROM DATABASE
        function loadStudents() {

            fetch('/students')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Database API error');
                }
                return response.json();
            })
            .then(data => {

                let output = '';

                data.forEach(student => {

                    output +=
                        '<div class="student">' +
                        '<b>' + student.student_id + '</b> - ' +
                        student.name + '<br>' +
                        student.program + ' | Year ' +
                        student.year + ' | Section ' +
                        student.section +
                        '</div>';

                });

                document.getElementById('studentList').innerHTML =
                    output || 'No student records found.';

            })
            .catch(error => {

                document.getElementById('studentList').innerText =
                    'Unable to retrieve student records.';

            });

        }


        // SEARCH STUDENTS BY SECTION
        function searchSection() {

            const section =
                document.getElementById('sectionInput').value.trim();

            if (!section) {
                document.getElementById('sectionResult').innerText =
                    'Please enter a section.';
                return;
            }

            fetch('/students/section/' + encodeURIComponent(section))
            .then(response => {
                if (!response.ok) {
                    throw new Error('Section API error');
                }
                return response.json();
            })
            .then(data => {

                let output = '';

                data.forEach(student => {

                    output +=
                        '<div class="student">' +
                        '<b>' + student.name + '</b><br>' +
                        student.student_id + ' | ' +
                        student.program + ' | Year ' +
                        student.year +
                        '</div>';

                });

                document.getElementById('sectionResult').innerHTML =
                    output || 'No students found in this section.';

            })
            .catch(error => {

                document.getElementById('sectionResult').innerText =
                    'Unable to search students.';

            });

        }

    </script>

</body>
</html>
