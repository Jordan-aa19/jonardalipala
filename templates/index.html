
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 950px;
            margin: 30px auto;
            padding: 20px;
            background: #f2f4f8;
            color: #263449;
        }

        h1, h2 {
            color: #183153;
        }

        h1 {
            text-align: center;
        }

        .card {
            background: white;
            padding: 22px;
            margin-bottom: 22px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,.08);
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 11px;
            margin: 6px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 15px;
            margin: 5px 3px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #087cff;
            color: white;
        }

        button:hover {
            opacity: .85;
        }

        .delete {
            background: #d93636;
        }

        .edit {
            background: #16834b;
        }

        .cancel {
            background: #777;
        }

        .record {
            background: #f8fafc;
            border: 1px solid #ddd;
            border-radius: 7px;
            padding: 13px;
            margin: 10px 0;
        }

        .message {
            margin-top: 12px;
            padding: 10px;
        }

        .source {
            color: #555;
            font-size: 13px;
        }

        .detail {
            background: #eef5ff;
            padding: 12px;
            border-radius: 6px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<h1>Student Management System</h1>
<p style="text-align:center">Laboratory Activity 8 - CRUD Application</p>

<!-- CREATE AND UPDATE -->
<div class="card">
    <h2>Student Information</h2>

    <form id="studentForm">
        <input type="hidden" id="recordId">

        <input id="student_id" placeholder="Student ID" required>
        <input id="name" placeholder="Student Name" required>
        <input id="program" placeholder="Program (BSIT)" required>
        <input id="year" type="number" min="1" placeholder="Year Level" required>
        <input id="section" placeholder="Section (A)" required>

        <button type="submit" id="saveButton">Add Student</button>
        <button type="button" class="cancel" onclick="resetForm()">Clear Form</button>
    </form>

    <p id="formMessage" class="message" aria-live="polite"></p>
</div>


<!-- MY RECORDS -->
<div class="card">
    <h2>My Records</h2>
    <p class="source">Source: Your own SQLite database</p>

    <button onclick="loadStudents()">Refresh Records</button>

    <input
        id="searchInput"
        placeholder="Search by name, student ID, or program"
        oninput="filterStudents()"
    >

    <div id="studentList">Loading records...</div>
</div>


<!-- REMOTE STUDENT RECORDS -->
<div class="card">
    <h2>Classmate's Records</h2>
    <p class="source">Source: Classmate's Render API (read-only)</p>

    <button onclick="loadClassmate()">Load Classmate's Records</button>

    <div id="classmateList">
        Waiting for your classmate's API URL.
    </div>

    <div id="remoteDetails" class="detail" hidden></div>
</div>


<script>

let myStudents = [];
let remoteStudents = [];

// SAFE TEXT DISPLAY
function makeText(tag, value) {
    const element = document.createElement(tag);
    element.textContent = value ?? '';
    return element;
}


// LOAD OWN STUDENTS
async function loadStudents() {
    const list = document.getElementById('studentList');
    list.textContent = 'Loading records...';

    try {
        const response = await fetch('/api/students');

        if (!response.ok) {
            throw new Error('Unable to load records');
        }

        myStudents = await response.json();
        filterStudents();

    } catch (error) {
        list.textContent = error.message;
    }
}


// DISPLAY OWN STUDENTS
function filterStudents() {
    const search = document.getElementById('searchInput')
        .value.toLowerCase();

    const list = document.getElementById('studentList');
    list.replaceChildren();

    const filtered = myStudents.filter(student =>
        [
            student.student_id,
            student.name,
            student.program,
            student.section
        ].some(value => String(value).toLowerCase().includes(search))
    );

    if (filtered.length === 0) {
        list.textContent = 'No student records found.';
        return;
    }

    filtered.forEach(student => {
        const card = document.createElement('div');
        card.className = 'record';

        card.append(
            makeText('strong', student.student_id + ' - ' + student.name),
            makeText('p', student.program + ' | Year ' +
                student.year + ' | Section ' + student.section)
        );

        const editButton = makeText('button', 'Edit');
        editButton.className = 'edit';
        editButton.type = 'button';
        editButton.onclick = () => editStudent(student.id);

        const deleteButton = makeText('button', 'Delete');
        deleteButton.className = 'delete';
        deleteButton.type = 'button';
        deleteButton.onclick = () => deleteStudent(student.id);

        card.append(editButton, deleteButton);
        list.append(card);
    });
}


// CREATE OR UPDATE
document.getElementById('studentForm')
.addEventListener('submit', async function(event) {
    event.preventDefault();

    const id = document.getElementById('recordId').value;

    const studentData = {
        student_id: document.getElementById('student_id').value.trim(),
        name: document.getElementById('name').value.trim(),
        program: document.getElementById('program').value.trim(),
        year: Number(document.getElementById('year').value),
        section: document.getElementById('section').value.trim()
    };

    const message = document.getElementById('formMessage');

    try {
        const response = await fetch(
            id ? `/api/students/${id}` : '/api/students',
            {
                method: id ? 'PUT' : 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(studentData)
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || 'Operation failed');
        }

        message.textContent = data.message;
        resetForm();
        await loadStudents();

    } catch (error) {
        message.textContent = error.message;
    }
});


// EDIT STUDENT
function editStudent(id) {
    const student = myStudents.find(item => item.id === id);

    if (!student) return;

    document.getElementById('recordId').value = student.id;
    document.getElementById('student_id').value = student.student_id;
    document.getElementById('name').value = student.name;
    document.getElementById('program').value = student.program;
    document.getElementById('year').value = student.year;
    document.getElementById('section').value = student.section;

    document.getElementById('saveButton').textContent = 'Update Student';

    window.scrollTo({top: 0, behavior: 'smooth'});
}


// DELETE STUDENT
async function deleteStudent(id) {
    if (!confirm('Are you sure you want to delete this student?')) {
        return;
    }

    try {
        const response = await fetch(`/api/students/${id}`, {
            method: 'DELETE'
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || 'Delete failed');
        }

        alert(data.message);
        resetForm();
        await loadStudents();

    } catch (error) {
        alert(error.message);
    }
}


// CLEAR FORM
function resetForm() {
    document.getElementById('studentForm').reset();
    document.getElementById('recordId').value = '';
    document.getElementById('saveButton').textContent = 'Add Student';
}


// LOAD CLASSMATE RECORDS
async function loadClassmate() {
    const list = document.getElementById('classmateList');
    const details = document.getElementById('remoteDetails');

    list.textContent = 'Loading classmate records...';
    details.hidden = true;

    try {
        const response = await fetch('/api/classmate/students');
        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || 'Unable to load records');
        }

        remoteStudents = data;
        list.replaceChildren();

        if (remoteStudents.length === 0) {
            list.textContent = 'No classmate records found.';
            return;
        }

        remoteStudents.forEach((student, index) => {
            const card = document.createElement('div');
            card.className = 'record';

            card.append(
                makeText('strong', student.student_id || 'Student ' + (index + 1)),
                makeText('p', student.name || 'Name unavailable')
            );

            const button = makeText('button', 'View Details');
            button.type = 'button';

            button.onclick = () => {
                details.replaceChildren();

                const title = makeText('strong', 'Classmate Student Details');

                details.append(title);

                Object.entries(student).forEach(([key, value]) => {
                    const p = document.createElement('p');
                    p.textContent = key + ': ' + value;
                    details.append(p);
                });

                details.hidden = false;
            };

            card.append(button);
            list.append(card);
        });

    } catch (error) {
        list.textContent = error.message;
    }
}


// LOAD MY RECORDS WHEN PAGE OPENS
loadStudents();

</script>

</body>
</html>
